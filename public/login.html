<!-- ## public/login.html ##-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        
        .login-form {
            width: 90%;
            max-width: 400px;
            padding: 2.25em;
            box-sizing: border-box;
            border-radius: 0.5em;
            border: 1px solid;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body.dark-mode .login-form {
            background-color: #37354d;
            border-color: #555; 
            box-shadow:0 4px 8px rgba(0,0,0,.3);
        }

        body:not(.dark-mode) .login-form {
            background-color: #fff;
            border-color: #ccc;
        }

        .login-form h1 {
            text-align: center;
            margin-bottom: 1.5em;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .login-form .input-group {
            margin-bottom: 1.5em;
        }

        .login-form label {
            display: block;
            margin-bottom: 0.5em;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .login-form input[type="email"],
        .login-form input[type="password"] {
            width: 100%;
            height: 50px;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid;
            border-radius: 4px;
            padding: 0 1em;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s, background-color 0.3s, color 0.3s;
        }

        body.dark-mode .login-form input[type="email"],
        body.dark-mode .login-form input[type="password"] {
            background-color: #4a4e50;
            border-color: #666;
            color: #f0f0f0;
        }

        body:not(.dark-mode) .login-form input[type="email"],
        body:not(.dark-mode) .login-form input[type="password"] {
            background-color: #fff;
            border-color: #aaa;
            color: #353538;
        }

        .login-form button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: #fff;
            transition: background-color 0.3s ease;
            margin-top: 1em;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.dark-mode .login-form button {
            background-color: #217093;
        }
        body.dark-mode .login-form button:hover:not(:disabled) {
            background-color: #1b5a75;
        }
        body.dark-mode .login-form button:disabled {
            background-color: #1b4d63;
            cursor: not-allowed;
        }

        body:not(.dark-mode) .login-form button {
            background-color: #4eb8dd;
        }
        body:not(.dark-mode) .login-form button:hover:not(:disabled) {
            background-color: #3ca7cf;
        }
        body:not(.dark-mode) .login-form button:disabled {
            background-color: #3a94b3;
            cursor: not-allowed;
        }

        .error-message {
            color: #f44336; 
            text-align: center;
            margin-top: 1em;
            font-weight: 600;
            display: none; 
        }


        
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: 'Open Sans', sans-serif;
      }

/* Dark Theme Background */
/* gradient and input fields styling by Tyler Fry https://codepen.io/frytyler/pen/nJYVEO */
body.dark-mode {
  	background: -moz-radial-gradient(0% 100%, ellipse cover, rgba(104,128,138,.4) 10%,rgba(138,114,76,0) 40%),-moz-linear-gradient(top,  rgba(57,173,219,.25) 0%, rgba(42,60,87,.4) 100%), -moz-linear-gradient(-45deg,  #670d10 0%, #092756 100%);
	background: -webkit-radial-gradient(0% 100%, ellipse cover, rgba(104,128,138,.4) 10%,rgba(138,114,76,0) 40%), -webkit-linear-gradient(top,  rgba(57,173,219,.25) 0%,rgba(42,60,87,.4) 100%), -webkit-linear-gradient(-45deg,  #670d10 0%,#092756 100%);
	background: -o-radial-gradient(0% 100%, ellipse cover, rgba(104,128,138,.4) 10%,rgba(138,114,76,0) 40%), -o-linear-gradient(top,  rgba(57,173,219,.25) 0%,rgba(42,60,87,.4) 100%), -o-linear-gradient(-45deg,  #670d10 0%,#092756 100%);
	background: -ms-radial-gradient(0% 100%, ellipse cover, rgba(104,128,138,.4) 10%,rgba(138,114,76,0) 40%), -ms-linear-gradient(top,  rgba(57,173,219,.25) 0%,rgba(42,60,87,.4) 100%), -ms-linear-gradient(-45deg,  #670d10 0%,#092756 100%);
	background: -webkit-radial-gradient(0% 100%, ellipse cover, rgba(104,128,138,.4) 10%,rgba(138,114,76,0) 40%), linear-gradient(to bottom,  rgba(57,173,219,.25) 0%,rgba(42,60,87,.4) 100%), linear-gradient(135deg,  #670d10 0%,#092756 100%);
  
}

/* Light Theme Background */
body:not(.dark-mode) {
  background: linear-gradient(135deg, #f0f9ff, #cbebff);
  transition: background 0.3s;
}

/* Theme Switcher Button */
.theme-switcher {
  position: fixed;
  top: 1rem;
  right: 1rem;
  background: none;
  border: none;
  width: 64px;
  height: 64px;
  cursor: pointer;
  outline: none;
  z-index: 1000;
}


.center-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}


.login-header h1 {
  margin: 0 0 1em;
  letter-spacing: 1px;
  text-align: center;
  color: #217093;
}
body:not(.dark-mode) .login-header h1 {
  color: #333;
}


.login-form {
  width: 90%;
  max-width: 400px;
  padding: 2.25em;
  border-radius: 0.5em;
  background-color: rgba(59, 62, 64, 0.2);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  border: none;
}
body:not(.dark-mode) .login-form {
  background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(240,240,240,0.9));
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
  border: none;
}


.svgContainer {
  position: relative;
  width: 100%;
  max-width: 220px;
  margin: 0 auto 1em;
  pointer-events: none;
}
.svgWrapper {
  position: relative;
  width: 100%;
  padding-bottom: 100%; 
  overflow: visible;
}

/* Password and Username Input Groups */
.input-group {
  margin-bottom: 1.5em;
}
.input-group input {
  width: 100%;
  height: 50px;
  padding: 0 1em;
  font-size: 1rem;
  font-weight: 600;
  border: 2px solid rgba(0,0,0,0.3);
  border-radius: 4px;
  outline: none;
  background: rgba(0,0,0,0.3);
  color: #fff;
  text-shadow: 1px 1px 1px rgba(0,0,0,0.3);
  transition: box-shadow 0.5s ease;
  box-shadow: inset 0 -5px 45px rgba(100,100,100,0.2), 0 1px 1px rgba(255,255,255,0.2);
}
body:not(.dark-mode) .input-group input {
  background: rgba(255,255,255,0.8);
  color: #333;
  text-shadow: none;
  border: 1px solid rgba(0,0,0,0.1);
}
.input-group input:focus {
  box-shadow: inset 0 -5px 45px rgba(100,100,100,0.4), 0 1px 1px rgba(255,255,255,0.2);
}


input::placeholder {
  color: rgba(255,255,255,0.7);
}
body:not(.dark-mode) input::placeholder {
  color: rgba(0,0,0,0.7);
}

/* Login Button Styling */
.input-group button {
  width: 100%;
  height: 50px;
  font-size: 1rem;
  font-weight: 600;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  background-color: #217093;
  color: #f0f0f0;
}
body:not(.dark-mode) .input-group button {
  background-color: #4eb8dd;
  color: #fff;
}

.mySVG {
  transform-origin: center;
  transform-box: fill-box;
}




    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    
    <button id="themeSwitcher" class="theme-switcher"></button>
    <div class="center-container">
    
      <div class="login-header">
        <h1>Admin Login</h1>
      </div>
      <!-- Login Form -->
      <form id="login-form" class="login-form">
        <div class="svgContainer">
          <div class="svgWrapper" id="svgWrapper">
            <!-- SVG inject here -->
          </div>
        </div>
        <div class="input-group">
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>
        <div class="input-group">
            <div id="error-message" class="error-message"></div>
            <button type="submit" id="login-button">Login</button>
        </div>
      </form>
    </div>


    <script src="login.js"></script>
</body>
</html>
